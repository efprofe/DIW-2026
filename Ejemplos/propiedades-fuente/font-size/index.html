<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font-size</title>
    <style>
        div.a {
            font-size: 15px;
        }
        div.b {
            font-size: large;
        }
        div.c {
            font-size: large;
        }
        div.d {
            font-size: larger;
        }
    </style>
</head>
<body>
    <h1>La propiedad font-size</h1>

    <div class="a">Es un texto con tamaño 15px.</div>
    <div class="b">Es un texto con tamaño large.</div>
    <div class="c">Es un texto con tamaño 150%.
        <p class="d">Párrafo con letra mayor que su padre</p>
    </div>
</body>
</html>
