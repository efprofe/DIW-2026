<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input text</title>
    <style>

        
        form {
            width: 280px;
        }

        form fieldset {
            background-color: rgb(198, 209, 255);
            border: 1px solid;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        form legend {
            font-weight: bold;
            padding: 0 10px;
        }

        form div {
            margin-bottom: 15px;
        }

        form label {
            display:inline-block;
            width: 30%;
            margin-bottom: 2px;
            vertical-align: middle;
        }

        form input
        {
            display:inline-block;
            width: 60%;
            margin-bottom: 2px;
        }


        .form-button {
            text-align: center;
         
        }

    </style>
</head>
<body>
    
    <h1>Formularios</h1>
    <form action="#" method="post" target="_blank" enctype="multipart/form-data">

        <fieldset>
            <legend>Datos personales</legend>

            <div>
                <label for="nombre-text">Nombre</label>
                <input type="text" id="nombre-text" name="nombre-text" 
                       placeholder="introduce tu nombre"
                       autofocus>
            </div>
            
            <div>
                <label for="apellidos-text">Apellidos</label>
                <input type="text" id="apelllidos-text" name="apellidos-text"
                        placeholder="introduce tus apellidos">
            </div>   
            
            <div>
                <label for="fecha">Fecha de nacimiento</label>
                <input type="datetime-local" name="fecha">
            </div>

        </fieldset>

        <fieldset>
            <legend>Datos de contacto</legend>

            <div>
                <label for="email"> Email</label>
                <input type="email" name="email" 
                        placeholder="correo@edu.xunta.gal" required>
            </div>
            
            <div>
                <label for="tel-contacto">Teléfono</label>
                <input type="tel" id="tel-contacto" name="tel-contacto"
                        placeholder="123456789" pattern="[0-9]{9}">
            </div>
        </fieldset>

        <fieldset>
            <legend>Inicio sesión</legend>

            <div>
                <label for="nombre-usuario">Usuario</label>
                <input type="text" id="nombre-usuario" name="nombre-usuario"
                    required>
            </div>
           
            <div>
                <label for="pass-usuario">Contraseña</label>
                <input type="password" id="pass-usuario" name="pass-usuario"
                    minlength="12" required>
            </div>

        </fieldset>

         <fieldset>
            <legend>Otros</legend>

            <div>
                <label for="color-usuario">Color</label>
                <input type="color" id="color-usuario" name="color-usuario">
            </div>
           
            <div>
                <label for="rango-usuario">Rango</label>
                <input type="range" id="rango-usuario" name="rango-usuario"
                        min="0" max="10">
            </div>

            <div>
                <label for="edad-usuario">Edad</label>
                <input type="number" id="edad-usuario" name="edad-usuario"
                        min="0" max="120">
            </div>

            <div class="form-button">
                <button>Enviar formulario</button>
            </div>

        </fieldset>

        </form>

</body>
</html>
